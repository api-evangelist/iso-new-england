apis:
- aid: iso-new-england:iso-ne-web-services-api
  name: ISO New England Web Services API v1.1
  description: ISO New England's RESTful interface to energy and market data, deployed November
    2013 and still the current version. The public Enunciate-generated technical documentation at
    webservices.iso-ne.com/docs/v1.1/ lists 477 unique path templates across 90 root resources -
    five-minute and hourly locational marginal prices, day-ahead and real-time demand, generation
    fuel mix, system load, external interchange and flows, day-ahead and real-time constraints,
    operating reserve and reserve prices, regulation clearing prices, Forward Capacity Market
    auction and reconfiguration results, FTR auction clearing prices and results, NCPC, outages,
    seven-day and seven-day wind forecasts, load forecasts, power system status and conditions,
    demand response dispatch and price-response events, locations, and hourly-bid participant
    resources. Every feed is available in XML and JSON, selected by a .xml/.json extension on the
    request URL or by an Accept header. A WADL description is published at
    https://webservices.iso-ne.com/api/v1.1?_wadl&_type=xml but is itself behind authentication.
    Authentication is HTTP Basic over SSL; anonymous requests to the base path, to any resource,
    and to the WADL all return HTTP 401. Credentials come from a free ISO Express account, which
    ISO New England states automatically grants access to the data feeds.
  humanURL: https://webservices.iso-ne.com/docs/v1.1/
  baseURL: https://webservices.iso-ne.com/api/v1.1
