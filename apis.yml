aid: iso-new-england
url: https://raw.githubusercontent.com/api-evangelist/iso-new-england/refs/heads/main/apis.yml
name: ISO New England
kind: company
description: ISO New England Inc. is the independent, nonprofit regional transmission organization authorized
  by the Federal Energy Regulatory Commission to operate the high-voltage power system, administer the
  wholesale electricity markets, and plan the power system for Connecticut, Rhode Island, Massachusetts,
  Vermont, New Hampshire, and most of Maine. Home market is the United States. It sits at the wholesale
  layer of the value chain, between generators, transmission owners, interconnections with New York and
  Canada, and the load-serving entities that resell power to retail customers - and it states on its own
  site that handling retail electricity is something it does not do. Its API posture is the sector's classic
  split, read from the wholesale end. Market and system data is genuinely open, so open that the ISO Express
  portal serves full nodal day-ahead LMP files as anonymous CSV and the public dashboards are backed by
  an anonymous JSON feed. Consumer data does not exist here at all, and cannot, because ISO New England
  holds no retail customer relationships and no Green Button, ESPI, or consumer data-portability mandate
  reaches it. The one documented programmatic contract, the Web Services API v1.1, is a real, richly documented
  RESTful surface of 477 path templates across 90 market and operations resources, but it answers 401
  to anonymous callers - a developer must first create a free, self-serve ISO Express account, which the
  ISO says automatically grants access to the data feeds, and then authenticate with HTTP Basic over SSL.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: unknown
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Unknown
  confidence: low
  source:
  - authentication
  - security
  generated: '2026-09-03'
  method: derived
imageNote: The `image` property was removed on 2026-08-26. It had been copied verbatim out of a bootstrap
  template and pointed at an icon belonging to groq, not to this company. That asset returns HTTP 200,
  so the record rendered another company's brand rather than a broken image, which is why it went unreported
  (roadmap#153). No correct icon has been sourced yet. Shipping the wrong company's mark is worse than
  shipping none; re-run the icon backfill once a real asset exists.
