paths:
  /fcmara/cp/{cp}:
    get:
      operationId: getFcmaraCpByCp
      summary: GET /fcmara/cp/{cp}
      description: (no documentation provided)
      tags:
      - fcmara
      responses:
        '200':
          description: Successful response.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FCMRAResults'
            application/json:
              schema:
                $ref: '#/components/schemas/FCMRAResults'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.fcmara.cp.cp.html
        harvested: '2026-07-27'
      x-xml-element: FCMRAResults
      parameters:
      - name: cp
        in: path
        required: true
        schema:
          type: string
  /fcmara/cp/{cp}/ara/{ara}:
    get:
      operationId: getFcmaraCpByCpAraByAra
