      x-xml-element: FCMRAResults
      parameters:
      - name: cp
        in: path
        required: true
        schema:
          type: string
      - name: ara
        in: path
        required: true
        schema:
          type: string
  /fcmara/current:
    get:
      operationId: getFcmaraCurrent
      summary: GET /fcmara/current
