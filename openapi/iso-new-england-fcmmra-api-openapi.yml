      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ClearedInterfaces
    SystemResults:
      type: object
      properties:
        SupplySubmitted:
          type: number
        SupplyCleared:
          type: number
        DemandSubmitted:
          type: number
        DemandCleared:
          type: number
        NetCapacityCleared:
          type: number
      required:
