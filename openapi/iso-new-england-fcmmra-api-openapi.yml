components:
  schemas:
    ServiceInfo:
      type: object
      properties:
        LatestBeginDate:
          type: string
          format: date-time
        CreationDate:
          type: string
          format: date-time
      required:
      - LatestBeginDate
      - CreationDate
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ServiceInfo
    ClearedCapacityZone:
      type: object
      properties:
        CapacityZoneID:
          type: integer
        CapacityZoneType:
          type: string
        CapacityZoneName:
          type: string
        SupplySubmitted:
          type: number
        DemandSubmitted:
          type: number
        SupplyCleared:
          type: number
        DemandCleared:
          type: number
        NetCapacityCleared:
          type: number
        ISOSupplySubmitted:
          type: number
        ISOSupplyCleared:
          type: number
        ISODemandSubmitted:
          type: number
        ISODemandCleared:
          type: number
        ClearingPrice:
          type: number
        ClearedExternalInterfaces:
          $ref: '#/components/schemas/ClearedInterfaces'
      required:
      - CapacityZoneID
      - CapacityZoneName
      - SupplySubmitted
      - DemandSubmitted
      - SupplyCleared
      - DemandCleared
      - NetCapacityCleared
      - ClearingPrice
      - ClearedExternalInterfaces
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ClearedCapacityZone
    ClearedInterface:
      type: object
      properties:
        ExternalInterfaceId:
          type: integer
        ExternalInterfaceName:
          type: string
        SupplySubmitted:
          type: number
        DemandSubmitted:
          type: number
        SupplyCleared:
          type: number
        DemandCleared:
          type: number
        NetCapacityCleared:
          type: number
        ISOSupplySubmitted:
          type: number
        ISOSupplyCleared:
          type: number
        ClearingPrice:
          type: number
      required:
      - ExternalInterfaceId
      - ExternalInterfaceName
      - SupplySubmitted
      - DemandSubmitted
      - SupplyCleared
      - DemandCleared
      - NetCapacityCleared
      - ClearingPrice
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ClearedInterface
    Period:
      type: object
      properties:
        Id:
          type: integer
        Description:
          type: string
        Type:
          type: string
        BeginDate:
          type: string
          format: date-time
        EndDate:
          type: string
          format: date-time
        ParentId:
          type: integer
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_Period
    SystemDemandCurveResults:
      type: object
      properties:
        SubmittedRepresentativeCsoMw:
          type: number
        SubmittedSdcMw:
          type: number
        ClearedRepresentativeCsoMw:
          type: number
        ClearedSdcMw:
          type: number
        ClearedNetCapacityMw:
          type: number
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_SystemDemandCurveResults
    ClearedCapacityZones:
      type: object
      properties:
        ClearedCapacityZone:
          type: array
          items:
            $ref: '#/components/schemas/ClearedCapacityZone'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ClearedCapacityZones
    Auction:
      type: object
      properties:
        Id:
          type: integer
        Description:
          type: string
        ApprovalDate:
          type: string
          format: date-time
        AuctionBeginDate:
          type: string
          format: date-time
        Type:
          type: string
        CommitmentPeriod:
          $ref: '#/components/schemas/Period'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_Auction
    ISOParticipation:
      type: object
      properties:
        ISOSupplySubmitted:
          type: number
        ISODemandSubmitted:
          type: number
        ISOSupplyCleared:
          type: number
        ISODemandCleared:
