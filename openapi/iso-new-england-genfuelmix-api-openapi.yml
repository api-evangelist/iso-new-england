  /genfuelmix/current/fuelCategoryRollup/{fuelCategoryRollup}:
    get:
      operationId: getGenfuelmixCurrentFuelCategoryRollupByFuelCategoryRollup
      summary: Get the current Gen Fuel Mixes for a given fuelCategoryRollup
      description: Get the current Gen Fuel Mixes for a given fuelCategoryRollup.
      tags:
      - genfuelmix
      responses:
        '200':
          description: a GenFuelMixesElement containing the current Gen Fuel Mixes for the given fuel category.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/GenFuelMixes'
            application/json:
              schema:
                $ref: '#/components/schemas/GenFuelMixes'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.genfuelmix.current.fuelCategoryRollup.fuelCategoryRollup.html
        harvested: '2026-07-27'
      x-xml-element: GenFuelMixes
      parameters:
      - name: fuelCategoryRollup
        in: path
        required: true
        schema:
          type: string
        description: The fuel category
  /genfuelmix/day/{day}:
    get:
      operationId: getGenfuelmixDayByDay
      summary: Get an entire days Gen Fuel Mix for given day
      description: Get an entire days Gen Fuel Mix for given day. Only the past [?] days are supported.
      tags:
      - genfuelmix
      responses:
        '200':
          description: a GenFuelMixesElement containing the Gen Fuel Mix.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/GenFuelMixes'
            application/json:
              schema:
