      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
        description: The day to retrieve data for (YYYYMMDD)
  /genfuelmix/day/{day}/fuelCategoryRollup/{fuelCategoryRollup}:
    get:
      operationId: getGenfuelmixDayByDayFuelCategoryRollupByFuelCategoryRollup
      summary: Get an entire days Gen Fuel Mix for given fuelCategoryRollup
      description: Get an entire days Gen Fuel Mix for given fuelCategoryRollup. Only the past [?] days are supported.
      tags:
      - genfuelmix
      responses:
        '200':
          description: a GenFuelMixesElement containing the Gen Fuel Mix.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/GenFuelMixes'
            application/json:
              schema:
                $ref: '#/components/schemas/GenFuelMixes'
