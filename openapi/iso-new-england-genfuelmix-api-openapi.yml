      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
        description: The day to retrieve data for (YYYYMMDD)
      - name: fuelCategoryRollup
        in: path
        required: true
        schema:
          type: string
        description: The fuel category
  /genfuelmix/info:
    get:
      operationId: getGenfuelmixInfo
      summary: Get the Service Info for Gen Fuel Mix
      description: Get the Service Info for Gen Fuel Mix.
      tags:
      - genfuelmix
      responses:
        '200':
          description: the ServiceInfoElement for Gen Fuel Mix.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
              example:
                ServiceInfo:
                  CreationDate: '2026-07-27T17:23:21.000-04:00'
                  LatestBeginDate: '2026-07-27T17:23:19.000-04:00'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.genfuelmix.info.html
        harvested: '2026-07-27'
      x-xml-element: ServiceInfo
      x-example-evidence:
        source: https://www.iso-ne.com/ws/wsclient (public ISO Express dashboard proxy, anonymous POST)
        observed: '2026-07-27'
        note: Real response payload observed anonymously through the public dashboard proxy; the proxy envelope and its _url key were removed.
components:
  schemas:
    ServiceInfo:
      type: object
      properties:
        LatestBeginDate:
          type: string
          format: date-time
        CreationDate:
          type: string
          format: date-time
      required:
      - LatestBeginDate
      - CreationDate
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ServiceInfo
    GenFuelMixes:
      type: object
      properties:
        GenFuelMix:
          type: array
          items:
            $ref: '#/components/schemas/GenFuelMix'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_GenFuelMixes
    GenFuelMix:
      type: object
      properties:
        BeginDate:
          type: string
          format: date-time
        GenMw:
          type: number
        FuelCategoryRollup:
          type: string
        FuelCategory:
          type: string
        MarginalFlag:
          type: string
          enum:
          - Y
          - N
          - '-'
      required:
      - BeginDate
      - GenMw
      - FuelCategoryRollup
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_GenFuelMix
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication over SSL. Credentials come from a free, self-serve ISO Express account; ISO New England states that ISO Express account holders are automatically granted access to the public data feeds. See https://www.iso-ne.com/participate/applications-status-changes/access-software-systems
