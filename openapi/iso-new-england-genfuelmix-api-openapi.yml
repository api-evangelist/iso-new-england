  description: 6 path template(s) under /genfuelmix in the published ISO New England Web Services API v1.1 documentation.
paths:
  /genfuelmix:
    get:
      operationId: getGenfuelmix
      summary: Default resource
      description: Default resource. Redirects to Gen Fuel Mix Info .
      tags:
      - genfuelmix
      responses:
        '200':
          description: Successful response.
          content:
            application/xml:
              schema:
                description: Response payload is not described in the published documentation.
            application/json:
              schema:
                description: Response payload is not described in the published documentation.
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.genfuelmix.html
        harvested: '2026-07-27'
