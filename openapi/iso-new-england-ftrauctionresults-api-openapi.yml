paths:
  /ftrauctionresults/{Type}/current:
    get:
      operationId: getFtrauctionresultsByTypeCurrent
      summary: Get the current FtrAuctionResults
      description: Get the current FtrAuctionResults.
      tags:
      - ftrauctionresults
      responses:
        '200':
          description: a FtrAuctionResultsElement containing the current FtrAuctionResults.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FtrAuctionResults'
            application/json:
              schema:
                $ref: '#/components/schemas/FtrAuctionResults'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.ftrauctionresults.Type.current.html
        harvested: '2026-07-27'
      x-xml-element: FtrAuctionResults
      parameters:
      - name: Type
        in: path
        required: true
        schema:
          type: string
  /ftrauctionresults/{Type}/info:
    get:
      operationId: getFtrauctionresultsByTypeInfo
      summary: Get the Service Info for FtrAuctionResults
      description: Get the Service Info for FtrAuctionResults.
      tags:
      - ftrauctionresults
      responses:
        '200':
          description: the ServiceInfoElement for FtrAuctionResults.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.ftrauctionresults.Type.info.html
        harvested: '2026-07-27'
      x-xml-element: ServiceInfo
      parameters:
      - name: Type
        in: path
        required: true
        schema:
          type: string
  /ftrauctionresults/{Type}/month/{month}:
    get:
      operationId: getFtrauctionresultsByTypeMonthByMonth
      summary: Get an entire months FtrAuctionResults
      description: Get an entire months FtrAuctionResults.
      tags:
      - ftrauctionresults
      responses:
        '200':
          description: a FtrAuctionResultsElement containing the FtrAuctionResults.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FtrAuctionResults'
            application/json:
              schema:
                $ref: '#/components/schemas/FtrAuctionResults'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.ftrauctionresults.Type.month.month.html
        harvested: '2026-07-27'
      x-xml-element: FtrAuctionResults
      parameters:
      - name: Type
        in: path
        required: true
        schema:
          type: string
      - name: month
        in: path
        required: true
        schema:
          type: string
        description: The month to retrieve data for (YYYYMM)
  /ftrauctionresults/{Type}/year/{year}:
    get:
      operationId: getFtrauctionresultsByTypeYearByYear
      summary: Get an entire year FtrAuctionClearingPrices
      description: Get an entire year FtrAuctionClearingPrices.
      tags:
      - ftrauctionresults
      responses:
        '200':
          description: a FtrAuctionResultsElement containing the FtrAuctionResults.
          content:
