      parameters:
      - name: cp
        in: path
        required: true
        schema:
          type: string
      - name: month
        in: path
        required: true
        schema:
          type: string
  /fcmmbp/current:
    get:
      operationId: getFcmmbpCurrent
      summary: GET /fcmmbp/current
