paths:
  /fcmmbp/cp/{cp}:
    get:
      operationId: getFcmmbpCpByCp
      summary: GET /fcmmbp/cp/{cp}
      description: (no documentation provided)
      tags:
      - fcmmbp
      responses:
        '200':
          description: Successful response.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FCMBilateralResults'
            application/json:
              schema:
                $ref: '#/components/schemas/FCMBilateralResults'
        '401':
          description: Unauthorized - HTTP Basic credentials from an ISO Express account are required. Verified by anonymous probe on 2026-07-27.
      x-evidence:
        source: https://webservices.iso-ne.com/docs/v1.1/rest.fcmmbp.cp.cp.html
        harvested: '2026-07-27'
      x-xml-element: FCMBilateralResults
      parameters:
      - name: cp
        in: path
        required: true
        schema:
          type: string
  /fcmmbp/cp/{cp}/month/{month}:
    get:
      operationId: getFcmmbpCpByCpMonthByMonth
      summary: GET /fcmmbp/cp/{cp}/month/{month}
