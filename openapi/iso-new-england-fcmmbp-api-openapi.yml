components:
  schemas:
    Auction:
      type: object
      properties:
        Id:
          type: integer
        Description:
          type: string
        ApprovalDate:
          type: string
          format: date-time
        AuctionBeginDate:
          type: string
          format: date-time
        Type:
          type: string
        CommitmentPeriod:
          $ref: '#/components/schemas/Period'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_Auction
    FCMBilateralResult:
      type: object
      properties:
        Auction:
          $ref: '#/components/schemas/Auction'
        MonthlyResults:
          $ref: '#/components/schemas/MonthlyResults'
      required:
      - Auction
      - MonthlyResults
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_FCMBilateralResult
    MonthlyResult:
      type: object
      properties:
        Month:
          type: string
          format: date-time
        ClearedCapacityZones:
          $ref: '#/components/schemas/BilatClearedCapacityZones'
        SystemResult:
          $ref: '#/components/schemas/BilatSystemResult'
      required:
      - Month
      - ClearedCapacityZones
      - SystemResult
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_MonthlyResult
    Period:
      type: object
      properties:
        Id:
          type: integer
        Description:
          type: string
        Type:
          type: string
        BeginDate:
          type: string
          format: date-time
        EndDate:
          type: string
          format: date-time
        ParentId:
          type: integer
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_Period
    FCMBilateralResults:
      type: object
      properties:
        FCMBilateralResult:
          type: array
          items:
            $ref: '#/components/schemas/FCMBilateralResult'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_FCMBilateralResults
    BilatClearedCapacityZone:
      type: object
      properties:
        CapacityZoneID:
          type: integer
        CapacityZoneType:
          type: string
        CapacityZoneName:
          type: string
        TransferringApproved:
          type: number
        AcquiringApproved:
          type: number
        NetCapacityApproved:
          type: number
        ClearedExternalInterfaces:
          $ref: '#/components/schemas/BilatClearedInterfaces'
      required:
      - CapacityZoneID
      - CapacityZoneName
      - TransferringApproved
      - AcquiringApproved
      - NetCapacityApproved
      - ClearedExternalInterfaces
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_BilatClearedCapacityZone
    ServiceInfo:
      type: object
      properties:
        LatestBeginDate:
          type: string
          format: date-time
        CreationDate:
          type: string
          format: date-time
      required:
      - LatestBeginDate
      - CreationDate
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_ServiceInfo
    BilatSystemResult:
      type: object
      properties:
        TransferringApproved:
          type: number
        AcquiringApproved:
          type: number
        NetCapacityApproved:
          type: number
        ClearedExternalInterfaces:
          $ref: '#/components/schemas/BilatClearedInterfaces'
      required:
      - TransferringApproved
      - AcquiringApproved
      - NetCapacityApproved
      - ClearedExternalInterfaces
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_BilatSystemResult
    BilatClearedInterfaces:
      type: object
      properties:
        ClearedExternalInterface:
          type: array
          items:
            $ref: '#/components/schemas/BilatClearedInterface'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_BilatClearedInterfaces
    BilatClearedInterface:
      type: object
      properties:
        ExternalInterfaceId:
          type: integer
        ExternalInterfaceName:
          type: string
        TransferringApproved:
          type: number
        AcquiringApproved:
          type: number
        NetCapacityApproved:
          type: number
        ClearedInterfaces:
          $ref: '#/components/schemas/BilatClearedInterfaces'
      required:
      - ExternalInterfaceId
      - ExternalInterfaceName
      - TransferringApproved
      - AcquiringApproved
      - NetCapacityApproved
      - ClearedInterfaces
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_BilatClearedInterface
    MonthlyResults:
      type: object
      properties:
        MonthlyResult:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyResult'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_MonthlyResults
    BilatClearedCapacityZones:
      type: object
      properties:
        ClearedCapacityZone:
          type: array
          items:
            $ref: '#/components/schemas/BilatClearedCapacityZone'
      x-xsd-source: schemas/iso-new-england-web-services-ns0.xsd#type_BilatClearedCapacityZones
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication over SSL. Credentials come from a free, self-serve ISO Express account; ISO New England states that ISO Express account holders are automatically granted access to the public data feeds. See https://www.iso-ne.com/participate/applications-status-changes/access-software-systems
